services:
  - type: web
    name: sigac-api
    runtime: dotnet
    region: frankfurt
    buildCommand: cd sigac-backend && dotnet restore && dotnet build -c Release
    startCommand: cd sigac-backend && dotnet run --project SIGAC.API -c Release --no-build
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
    healthCheckPath: /api/health
